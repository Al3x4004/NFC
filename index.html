<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Fitxatge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --plate-deep:#121513;
    --card:#eeeadd;
    --ink:#242019;
    --ink-soft:#5c5647;
    --brass:#a9803f;
    --brass-deep:#7a5a28;
    --brass-glow:#d4a855;
    --rust:#9c4a3d;
    --olive:#5b6b4f;
    --line:rgba(0,0,0,0.12);
    --line-light:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body{
    background:var(--plate-deep);
    background-image:radial-gradient(ellipse at top, rgba(255,255,255,0.03), transparent 60%);
    font-family:'Inter', system-ui, sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:0 0 2rem;
  }

  .rivet-bar{
    height:4px;
    background:linear-gradient(90deg, var(--brass-deep), var(--brass), var(--brass-deep));
  }

  header{
    padding:1.1rem 1rem 1.3rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  header .brand{display:flex; align-items:baseline; gap:8px;}
  header .brand .mark{
    width:9px;height:9px;border-radius:50%;
    background:var(--brass-glow);
    box-shadow:0 0 8px var(--brass-glow);
    flex-shrink:0;
  }
  header h1{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:17px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--card);
    margin:0;
  }

  main{
    padding:0 1rem;
    max-width:460px;
    margin:0 auto;
  }

  .fitxar-box{
    background:var(--card);
    border-radius:12px;
    padding:22px 20px 24px;
    box-shadow:0 10px 26px rgba(0,0,0,0.35);
    animation:rise .22s ease;
  }
  @keyframes rise{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .section-label{
    font-family:'Oswald', sans-serif;
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 14px 2px;
  }

  .go-btn{
    display:block;
    width:100%;
    padding:16px;
    border-radius:8px;
    border:none;
    background:var(--olive);
    color:#fff;
    font-family:'Oswald', sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-align:center;
    cursor:pointer;
  }
  .go-btn:active{filter:brightness(0.92);}
  .go-btn:disabled{opacity:.55; cursor:default;}

  .pin-setup label{
    display:block;
    font-family:'Oswald', sans-serif;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 8px 2px;
  }
  .pin-setup input{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    border-radius:8px;
    padding:14px 16px;
    font-family:'JetBrains Mono', monospace;
    font-size:22px;
    letter-spacing:.4em;
    text-align:center;
    color:var(--ink);
    margin-bottom:14px;
  }
  .fitxar-main{
    background:var(--brass);
    font-size:20px;
    padding:22px;
  }
  .fitxar-main.ok{background:var(--olive);}
  .fitxar-main.err{background:var(--rust);}

  .pin-note{
    margin:12px 0 0;
    font-size:12px;
    text-align:center;
    color:var(--ink-soft);
  }
  .pin-note a{color:var(--brass-deep);}

  .status-msg{
    text-align:center;
    font-size:13.5px;
    color:var(--ink);
    font-weight:600;
    padding:10px 0 4px;
    min-height:20px;
  }

  .hint{
    margin-top:12px;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.5;
    text-align:center;
  }
  .hint a{color:var(--brass-deep);}
</style>
</head>
<body>

<div class="rivet-bar"></div>

<header>
  <div class="brand">
    <span class="mark"></span>
    <h1>Fitxatge</h1>
  </div>
</header>

<main>
  <div class="fitxar-box">
    <p class="section-label">Fitxatge automàtic</p>

    <div id="pinSetup" class="pin-setup">
      <label for="pinInput">El teu PIN de Timenet</label>
      <input type="password" id="pinInput" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="••••" />
      <button id="pinSave" class="go-btn">Desar PIN</button>
    </div>

    <div id="fitxarReady" style="display:none;">
      <button id="fitxarBtn" class="go-btn fitxar-main">Fitxar</button>
      <p class="pin-note">PIN desat en aquest dispositiu · <a href="#" id="pinChange">Canviar</a></p>
    </div>

    <p class="status-msg" id="fitxarStatus"></p>
    <p class="hint"><a href="https://timenet-cp.gpisoftware.com/check/e87a5f18-d9ed-4191-9a7b-84f52fd87fdf" target="_blank" rel="noopener">Fitxar manualment amb el teclat</a></p>
  </div>
</main>

<script>
const WORKER_URL = "https://nfc-oficina.a-conde.workers.dev";
const PIN_KEY = 'fitxatge_pin';

const pinSetup = document.getElementById('pinSetup');
const fitxarReady = document.getElementById('fitxarReady');
const pinInput = document.getElementById('pinInput');
const pinSave = document.getElementById('pinSave');
const pinChange = document.getElementById('pinChange');
const fitxarBtn = document.getElementById('fitxarBtn');
const fitxarStatus = document.getElementById('fitxarStatus');

function refreshFitxarUI(){
  const pin = localStorage.getItem(PIN_KEY);
  pinSetup.style.display = pin ? 'none' : 'block';
  fitxarReady.style.display = pin ? 'block' : 'none';
}
refreshFitxarUI();

pinSave.addEventListener('click', ()=>{
  const pin = (pinInput.value || '').trim();
  if(!/^\d{4,6}$/.test(pin)){
    fitxarStatus.textContent = 'El PIN ha de tenir entre 4 i 6 xifres.';
    return;
  }
  localStorage.setItem(PIN_KEY, pin);
  pinInput.value = '';
  fitxarStatus.textContent = '';
  refreshFitxarUI();
});

pinChange.addEventListener('click', (e)=>{
  e.preventDefault();
  localStorage.removeItem(PIN_KEY);
  fitxarStatus.textContent = '';
  fitxarBtn.className = 'go-btn fitxar-main';
  fitxarBtn.textContent = 'Fitxar';
  refreshFitxarUI();
});

fitxarBtn.addEventListener('click', async ()=>{
  const pin = localStorage.getItem(PIN_KEY);
  if(!pin){ refreshFitxarUI(); return; }
  fitxarBtn.disabled = true;
  fitxarBtn.className = 'go-btn fitxar-main';
  fitxarBtn.textContent = 'Fitxant…';
  fitxarStatus.textContent = '';
  try{
    const res = await fetch(WORKER_URL + '/fitxar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    });
    const out = await res.json();
    if(out.ok){
      const esEntrada = out.action === 'entrada';
      fitxarBtn.className = 'go-btn fitxar-main ok';
      fitxarBtn.textContent = (esEntrada ? 'Entrada' : 'Sortida') + ' ✓';
      let msg = (esEntrada ? 'Entrada' : 'Sortida') + ' registrada';
      if(out.checkTime){
        const h = new Date(out.checkTime).toLocaleTimeString('ca-ES', {hour:'2-digit', minute:'2-digit'});
        msg += ' a les ' + h;
      }
      if(out.worker) msg += ' · ' + out.worker;
      if(out.repeated) msg += ' ⚠️ (ja havies fitxat fa poc)';
      fitxarStatus.textContent = msg + '.';
    }else if(out.code === 'pin'){
      fitxarBtn.className = 'go-btn fitxar-main err';
      fitxarBtn.textContent = 'PIN incorrecte';
      fitxarStatus.textContent = 'El PIN no és correcte. Toca "Canviar" per corregir-lo.';
    }else{
      fitxarBtn.className = 'go-btn fitxar-main err';
      fitxarBtn.textContent = 'Error';
      fitxarStatus.textContent = out.error || 'No s\'ha pogut fitxar.';
    }
  }catch(e){
    fitxarBtn.className = 'go-btn fitxar-main err';
    fitxarBtn.textContent = 'Error de connexió';
    fitxarStatus.textContent = 'No s\'ha pogut connectar. Torna-ho a provar.';
  }finally{
    fitxarBtn.disabled = false;
    setTimeout(()=>{
      if(fitxarBtn.textContent !== 'Fitxar'){
        fitxarBtn.className = 'go-btn fitxar-main';
        fitxarBtn.textContent = 'Fitxar';
      }
    }, 4000);
  }
});
</script>

</body>
</html>
